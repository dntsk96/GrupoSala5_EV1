<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AutoElite</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>AutoElite - Iniciar Sesión</h1>
    </header>

    <main class="container">
        <form id="loginForm">
            <h2>Accede a tu cuenta</h2>
            
            <label>Email:</label>
            <input type="email" id="email" required>
            
            <label>Contraseña:</label>
            <input type="password" id="password" required>
            
            <button type="submit">Ingresar</button>
            <p id="mensaje"></p>
            
            <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </form>
    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
        const loginForm = document.getElementById('loginForm');
        const mensaje = document.getElementById('mensaje');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    mensaje.style.color = 'green';
                    mensaje.textContent = 'Login exitoso. Redirigiendo...';
                    setTimeout(() => {
                        window.location.href = 'precios.html'; // Cambia esto a donde quieras mandar
                    }, 1500);
                })
                .catch((error) => {
                    mensaje.style.color = 'red';
                    mensaje.textContent = 'Error: ' + error.message;
                });
        });

        // Si ya está logueado, redirigir
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'precios.html';
            }
        });
    </script>
</body>
</html>
