<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precios - AutoElite</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>AutoElite</h1>
        <p>Tu taller de confianza</p>
    </header>

    <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="proyectos.html">Proyectos</a></li>
                <li><a href="precios.html">Precios</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>

    <main>
    <section>
        <h2>Lista de Precios Actualizada</h2>
        <p>Usa el buscador para filtrar servicios. Todos los precios incluyen IGV.</p>

        <input type="text" id="buscador" placeholder="Buscar servicio..." style="width:100%; padding:10px; margin:15px 0; border:1px solid #ccc;">

        <table style="width:100%; border-collapse:collapse; margin-top:10px;">
            <thead style="background:#1e3a8a; color:white;">
                <tr>
                    <th style="padding:12px; border: 1px solid #1e3a8a;">Servicio</th>
                    <th style="padding:12px; border: 1px solid #1e3a8a;">Descripción</th>
                    <th style="padding:12px; border: 1px solid #1e3a8a;">Precio</th>
                    <th style="padding:12px; border: 1px solid #1e3a8a;">Tiempo Aprox.</th>
                </tr>
            </thead>
            <tbody id="tablaPrecios">
                <!-- JavaScript inserta las filas aquí -->
            </tbody>
        </table>
    </section>
</main>

<!-- El script DEBE ir al final, antes de </body> -->
<script src="js/tabla-precios.js"></script>
</body>
</html>
